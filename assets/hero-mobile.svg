<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="t d">
<title id="t">Aegis Desk</title>
<desc id="d">Aegis Desk: exit alerts from rules you adopted, for the options you already hold. A shield holds a payoff line with an amber threshold. A chat message from the Exit Sentinel reads: WATCH AG-20261028-03 | SPY protective put | your rule ROLL30; your plan: review a roll; not an instruction to trade; you act in your brokerage account. The desk never places, modifies or cancels an order.</desc>
<style>.s{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace}.tx{fill:#e9eef7}.mu{fill:#a3b1c9}.fa{fill:#8a98b3}.az{fill:#62b4ff}.am{fill:#f3b641}.co{fill:#ff8a73}.b{font-weight:700}.sb{font-weight:600}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}.pulse{animation:pulse 3.6s ease-in-out infinite}.d1{animation-delay:.6s}.d2{animation-delay:1.2s}.d3{animation-delay:1.8s}.d4{animation-delay:2.4s}@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:1}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1322"/><stop offset="1" stop-color="#121c30"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b1c9"/></marker><marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f3b641"/></marker></defs>
<rect x="0.5" y="0.5" width="399" height="469" rx="18" fill="url(#bg)" stroke="#2c3b5c"/>
<path d="M154 43.12Q200 29.44 246 43.12L246 96.7Q246 132.04 200 148Q154 132.04 154 96.7Z" fill="#17233a" stroke="#62b4ff" stroke-width="2.5"/>
<path d="M170.56 111.52L207.36 72.76L229.44 72.76" fill="none" stroke="#62b4ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="166.56" y1="86.44" x2="233.44" y2="86.44" stroke="#f3b641" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="194.37" cy="86.44" r="9" fill="#f3b641" opacity=".25" class="pulse"/>
<circle cx="194.37" cy="86.44" r="4.5" fill="#f3b641"/>
<text x="200" y="192" class="s b tx" font-size="32" text-anchor="middle" xml:space="preserve">Aegis Desk</text>
<text x="200" y="224" class="s tx" font-size="16.5" text-anchor="middle" xml:space="preserve">Exit alerts from rules you adopted,</text>
<text x="200" y="246" class="s tx" font-size="16.5" text-anchor="middle" xml:space="preserve">for the options you already hold.</text>
<text x="200" y="274" class="s mu" font-size="12.5" text-anchor="middle" xml:space="preserve">It never places, modifies or cancels an order.</text>
<text x="200" y="292" class="s mu" font-size="12.5" text-anchor="middle" xml:space="preserve">You decide and act in your own broker.</text>
<rect x="20" y="312" width="360" height="132.5" rx="14" fill="#17233a" stroke="#2c3b5c"/>
<rect x="32" y="326" width="4" height="104.5" rx="2" fill="#f3b641"/>
<circle cx="54" cy="334" r="9" fill="#1d2b46" stroke="#62b4ff"/>
<text x="54" y="338" class="s b az" font-size="10" text-anchor="middle" xml:space="preserve">E</text>
<text x="70" y="338.5" class="s sb tx" font-size="13" xml:space="preserve">Exit Sentinel</text>
<text x="160" y="338.5" class="s mu" font-size="12" xml:space="preserve">in your desk chat</text>
<text x="48" y="362" class="m tx" font-size="10.5" xml:space="preserve">WATCH AG-20261028-03 | SPY protective put</text>
<text x="48" y="378.5" class="m tx" font-size="10.5" xml:space="preserve">| your rule ROLL30</text>
<text x="48" y="395" class="m am" font-size="10.5" xml:space="preserve">your plan: review a roll</text>
<text x="48" y="411.5" class="m mu" font-size="10.5" xml:space="preserve">not an instruction to trade; you act in</text>
<text x="48" y="428" class="m mu" font-size="10.5" xml:space="preserve">your brokerage account.</text>
</svg>
