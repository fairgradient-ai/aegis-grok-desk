<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1040" width="400" height="1040" role="img" aria-labelledby="t d">
<title id="t">How the desk works</title>
<desc id="d">How the desk works: 1 your positions; 2 marked by the tools; 3 checked against your adopted rules; 4 an alert in your chat; 5 you act in your broker. When you ask "What are my choices?", the Structuring Desk scores choices for a position you hold by your own criteria, on request, and you still decide in your broker. Every number comes from a tool, with its source and time. Data that cannot be fetched is UNAVAILABLE, never a guess.</desc>
<style>.s{font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace}.tx{fill:#e9eef7}.mu{fill:#a3b1c9}.fa{fill:#8a98b3}.az{fill:#62b4ff}.am{fill:#f3b641}.co{fill:#ff8a73}.b{font-weight:700}.sb{font-weight:600}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}.pulse{animation:pulse 3.6s ease-in-out infinite}.d1{animation-delay:.6s}.d2{animation-delay:1.2s}.d3{animation-delay:1.8s}.d4{animation-delay:2.4s}@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:1}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1322"/><stop offset="1" stop-color="#121c30"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3b1c9"/></marker><marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f3b641"/></marker></defs>
<rect x="0.5" y="0.5" width="399" height="1039" rx="18" fill="url(#bg)" stroke="#2c3b5c"/>
<text x="20" y="38" class="s sb fa" font-size="11.5" xml:space="preserve">HOW THE DESK WORKS</text>
<text x="20" y="60" class="s sb tx" font-size="16" xml:space="preserve">From the positions you hold</text>
<text x="20" y="81" class="s sb tx" font-size="16" xml:space="preserve">to the decision you make</text>
<rect x="20" y="104" width="316" height="113" rx="12" fill="#17233a" stroke="#2c3b5c"/>
<circle cx="46" cy="132" r="12" fill="#1d2b46" stroke="#62b4ff" stroke-width="1.5"/>
<circle cx="46" cy="132" r="16" fill="none" stroke="#62b4ff" stroke-width="1" class="pulse "/>
<text x="46" y="136.5" class="s b tx" font-size="12" text-anchor="middle" xml:space="preserve">1</text>
<text x="70" y="137" class="s b tx" font-size="14.5" xml:space="preserve">Your positions</text>
<text x="70" y="159" class="s mu" font-size="12" xml:space="preserve">The book you keep in</text>
<text x="70" y="176" class="s mu" font-size="12" xml:space="preserve">positions.csv, drafted from your</text>
<text x="70" y="193" class="s mu" font-size="12" xml:space="preserve">own words.</text>
<line x1="46" y1="220" x2="46" y2="236" stroke="#a3b1c9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="239" width="316" height="113" rx="12" fill="#17233a" stroke="#2c3b5c"/>
<circle cx="46" cy="267" r="12" fill="#1d2b46" stroke="#62b4ff" stroke-width="1.5"/>
<circle cx="46" cy="267" r="16" fill="none" stroke="#62b4ff" stroke-width="1" class="pulse d1"/>
<text x="46" y="271.5" class="s b tx" font-size="12" text-anchor="middle" xml:space="preserve">2</text>
<text x="70" y="272" class="s b tx" font-size="14.5" xml:space="preserve">Marked by the tools</text>
<text x="70" y="294" class="s mu" font-size="12" xml:space="preserve">Quotes, P/L and Greeks from</text>
<text x="70" y="311" class="s mu" font-size="12" xml:space="preserve">deterministic tools, never from</text>
<text x="70" y="328" class="s mu" font-size="12" xml:space="preserve">the AI.</text>
<line x1="46" y1="355" x2="46" y2="371" stroke="#a3b1c9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="374" width="316" height="96" rx="12" fill="#17233a" stroke="#2c3b5c"/>
<circle cx="46" cy="402" r="12" fill="#1d2b46" stroke="#62b4ff" stroke-width="1.5"/>
<circle cx="46" cy="402" r="16" fill="none" stroke="#62b4ff" stroke-width="1" class="pulse d2"/>
<text x="46" y="406.5" class="s b tx" font-size="12" text-anchor="middle" xml:space="preserve">3</text>
<text x="70" y="407" class="s b tx" font-size="14.5" xml:space="preserve">Your adopted rules</text>
<text x="70" y="429" class="s mu" font-size="12" xml:space="preserve">Only the exit rules you said yes</text>
<text x="70" y="446" class="s mu" font-size="12" xml:space="preserve">to are checked.</text>
<line x1="46" y1="473" x2="46" y2="489" stroke="#a3b1c9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="492" width="316" height="96" rx="12" fill="#17233a" stroke="#2c3b5c"/>
<circle cx="46" cy="520" r="12" fill="#1d2b46" stroke="#f3b641" stroke-width="1.5"/>
<circle cx="46" cy="520" r="16" fill="none" stroke="#f3b641" stroke-width="1" class="pulse d3"/>
<text x="46" y="524.5" class="s b tx" font-size="12" text-anchor="middle" xml:space="preserve">4</text>
<text x="70" y="525" class="s b tx" font-size="14.5" xml:space="preserve">An alert in your chat</text>
<text x="70" y="547" class="s mu" font-size="12" xml:space="preserve">Which of your rules fired and why,</text>
<text x="70" y="564" class="s mu" font-size="12" xml:space="preserve">with the data's age.</text>
<line x1="46" y1="591" x2="46" y2="607" stroke="#a3b1c9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="610" width="316" height="96" rx="12" fill="#17233a" stroke="#2c3b5c"/>
<circle cx="46" cy="638" r="12" fill="#1d2b46" stroke="#62b4ff" stroke-width="1.5"/>
<circle cx="46" cy="638" r="16" fill="none" stroke="#62b4ff" stroke-width="1" class="pulse d4"/>
<text x="46" y="642.5" class="s b tx" font-size="12" text-anchor="middle" xml:space="preserve">5</text>
<text x="70" y="643" class="s b tx" font-size="14.5" xml:space="preserve">You act in your broker</text>
<text x="70" y="665" class="s mu" font-size="12" xml:space="preserve">The desk never places, modifies or</text>
<text x="70" y="682" class="s mu" font-size="12" xml:space="preserve">cancels orders.</text>
<path d="M339 540H358V760" fill="none" stroke="#f3b641" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="358" y1="760" x2="339" y2="760" stroke="#f3b641" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ara)"/>
<rect x="20" y="740" width="316" height="40" rx="20" fill="#1d2b46" stroke="#f3b641"/>
<text x="38" y="765" class="s sb am" font-size="12.5" xml:space="preserve">You ask</text>
<text x="94" y="765" class="s tx" font-size="13.5" xml:space="preserve">“What are my choices?”</text>
<line x1="46" y1="783" x2="46" y2="803" stroke="#f3b641" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ara)"/>
<rect x="20" y="806" width="316" height="104" rx="12" fill="#17233a" stroke="#f3b641" stroke-dasharray="5 4"/>
<text x="38" y="834" class="s b tx" font-size="14.5" xml:space="preserve">Structuring Desk</text>
<text x="170" y="834" class="s sb am" font-size="12" xml:space="preserve">on request</text>
<text x="38" y="858" class="s mu" font-size="12" xml:space="preserve">Scores choices for a position you hold,</text>
<text x="38" y="875" class="s mu" font-size="12" xml:space="preserve">by your own criteria. You still decide</text>
<text x="38" y="892" class="s mu" font-size="12" xml:space="preserve">in your broker.</text>
<text x="20" y="946" class="s mu" font-size="11.5" xml:space="preserve">Every number comes from a tool, with its source and</text>
<text x="20" y="963" class="s mu" font-size="11.5" xml:space="preserve">time. Data that cannot be fetched is UNAVAILABLE,</text>
<text x="20" y="980" class="s mu" font-size="11.5" xml:space="preserve">never a guess.</text>
</svg>
