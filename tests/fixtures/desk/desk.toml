# Fixture desk root (tests/fixtures/desk): the owner configuration the offline tool tests and
# the command journeys load. Alpaca paper host; freshness bound = 15 + 5 + 5 = 25 minutes (plan
# section 8). Tools copy this tree to a temporary directory before anything writes.
# Money values parse as Decimal; the cutoff as datetime.time; as_of as datetime.date.
[desk]
timezone = "America/New_York"
engagement = "active-owner"
cadence_profile = "lean"            # lean | active
chatty_or_quiet = "quiet"           # chatty | quiet

[owner]
broker_exercise_cutoff_et = 16:30:00
approval_level = 2                  # self-attested options approval level (0-5)
declared_equity = 250000.00
attention_thresholds = { pl_day_pct = 1.5, pl_trade_abs = 500.00 }
disclosures_acknowledged = [
  "occ-characteristics-and-risks-2024",
  "ai-role-disclosure",
]

[[owner.accounts]]
name = "Brokerage (margin)"
type = "margin"

[[owner.accounts]]
name = "Roth IRA"
type = "ira"

[market_data]
vendor = "alpaca"
host = "paper"                      # paper only: the desk holds an Alpaca paper key pair; "live" is refused
key_env = "APCA_API_KEY_ID"         # the NAMES of the variables, never the values; credentials_file is left
secret_env = "APCA_API_SECRET_KEY"  # at its default; offline runs load no credential
options_feed = "indicative"         # the free feed: 15-minute delayed, approximate (not exchange quotes)
stock_feed = "iex"                  # the only stock feed a paper-only account is entitled to
feed_delay_min = 15                 # indicative options are delayed 15 minutes (>= 15 required here)
quote_ttl_min = 5
grace_min = 5
pin_band = 0.25

[rates]
risk_free_rate = 0.0412
source = "3-month Treasury bill, owner-entered"
as_of = 2026-10-30

[levels]
order_shape_enabled = false
